<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PLANAI app icon</title>
  <desc id="desc">A blue calendar combined with a checkmark-shaped letter A and a small AI network symbol.</desc>

  <defs>
    <linearGradient id="background" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F9FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="94" y1="82" x2="424" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0758F5"/>
      <stop offset="0.55" stop-color="#1267F7"/>
      <stop offset="1" stop-color="#2478FF"/>
    </linearGradient>
    <linearGradient id="secondary" x1="126" y1="166" x2="270" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5F96F2"/>
      <stop offset="1" stop-color="#9EC1FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#background)"/>
  <rect x="9" y="9" width="494" height="494" rx="107" fill="none" stroke="#E7EDFA" stroke-width="2"/>

  <!-- Calendar frame -->
  <path
    d="M 420 280
       V 164
       C 420 136 398 114 370 114
       H 140
       C 111 114 88 137 88 166
       V 346
       C 88 379 113 404 146 404
       H 244"
    fill="none"
    stroke="url(#primary)"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Calendar binding tabs -->
  <path d="M 168 76 V 114" fill="none" stroke="url(#primary)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 336 76 V 114" fill="none" stroke="url(#primary)" stroke-width="24" stroke-linecap="round"/>

  <!-- Calendar date cells -->
  <g fill="url(#secondary)">
    <rect x="124" y="164" width="42" height="42" rx="9"/>
    <rect x="180" y="164" width="42" height="42" rx="9"/>
    <rect x="236" y="164" width="42" height="42" rx="9"/>

    <rect x="124" y="220" width="42" height="42" rx="9"/>
    <rect x="180" y="220" width="42" height="42" rx="9"/>
    <rect x="236" y="220" width="42" height="42" rx="9"/>

    <rect x="124" y="276" width="42" height="42" rx="9"/>
    <rect x="180" y="276" width="42" height="42" rx="9"/>
  </g>

  <!-- AI network motif -->
  <g stroke="url(#primary)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 342 184 L 307 230"/>
    <path d="M 342 184 L 382 236"/>
  </g>
  <g fill="url(#primary)">
    <circle cx="342" cy="184" r="18"/>
    <circle cx="307" cy="230" r="18"/>
    <circle cx="382" cy="236" r="18"/>
  </g>

  <!-- Integrated checkmark + A -->
  <path
    d="M 127 332
       L 181 384
       L 298 246
       C 307 235 317 236 324 249
       L 421 428"
    fill="none"
    stroke="url(#primary)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- A crossbar -->
  <path d="M 279 356 H 374" fill="none" stroke="url(#primary)" stroke-width="31" stroke-linecap="round"/>
</svg>
